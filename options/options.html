<!doctype html>
<meta charset="utf-8">
<title>Surasura – settings</title>
<style>body{font:14px system-ui;max-width:480px;margin:2em auto;padding:0 1em}input{width:100%;padding:6px;box-sizing:border-box}button{margin-top:8px;padding:6px 14px}</style>
<h2>Surasura token</h2>
<p>Copy the token from Surasura (where it shows the browser extension) and paste it here. It is stored only in this browser and sent only to <code>127.0.0.1:27631</code>.</p>
<input id="token" type="password" autocomplete="off" placeholder="token">
<button id="save">Save</button> <span id="msg"></span>
<script src="options.js"></script>
