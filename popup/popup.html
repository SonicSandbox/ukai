<!doctype html>
<meta charset="utf-8">
<title>Ukai</title>
<link rel="stylesheet" href="../ui/ukai.css">
<style>
  body{width:360px}
  /* probe:start */
  #probeOut img,#probeOut audio{width:100%;margin-top:4px}
  /* probe:end */
</style>
<div class="brand"><img src="../icons/icon-32.png" alt=""><b>Ukai</b><i>鵜飼</i><span>to Surasura</span></div>
<div class="page">
<div id="yt" hidden></div>
<div id="seasonPending" hidden></div>
<div id="mining" hidden></div>
<div id="main">
  <div id="none" hidden></div>
  <section id="found" hidden>
    <label>Subtitle track <select id="track"></select></label>
    <label>Title <input id="title"></label>
    <label>Show <input id="show" placeholder="(empty for a film)"></label>
    <div class="row"><label>Season <input id="season" type="number" min="0"></label>
    <label>Episode <input id="episode" type="number" min="0"></label></div>
    <div id="detected" class="muted"></div>
    <button id="send">Send to Surasura</button>
    <button id="seasonBtn" hidden>Send the whole season (experimental)</button>
  </section>
  <div id="msg" hidden></div>
  <div id="queue" class="muted"></div>
  <a href="#" id="opts">Token / settings</a>
</div>
<!-- probe:start -->
<hr>
<details>
  <summary>Capture probe (try by hand)</summary>
  <div class="muted">Records 5 s of this tab's audio and grabs one picture while the video plays. Nothing is saved or sent.</div>
  <button id="probe">Run capture probe</button>
  <div id="probeOut"></div>
</details>
<!-- probe:end -->
</div>
<script src="../src/delivery.js"></script>
<script src="../src/youtube.js"></script>
<script src="../src/hosts.js"></script>
<!-- probe:start -->
<script src="probe.js"></script>
<!-- probe:end -->
<script src="season.js"></script>
<script src="mining.js"></script>
<script src="popup.js"></script>
